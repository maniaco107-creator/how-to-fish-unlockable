<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>How To Fish — Homepage</title>
    <link rel="stylesheet" href="style.css">

    <style>
   body {
    background-color: #4ac3ff;
    font-family: 'Trebuchet MS', sans-serif;
    color: white;
    margin: 0;
    padding: 0;

    /* Centrage global */
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

/* Bannière centrée */
.banner {
    display: block;
    margin: 20px auto;

    /* Empêche l'image de s'étirer trop */
    max-width: 600px;
    width: 100%;

    border-radius: 12px;
    box-shadow: 0px 0px 20px rgba(0,0,0,0.25);
}


    .roadmap {
        background: rgba(255,255,255,0.15);
        width: 80%;
        max-width: 700px;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0px 0px 10px rgba(0,0,0,0.25);

        /* Centrer le contenu interne */
        margin: 30px auto;
        text-align: center;
    }

    .roadmap {
    background: rgba(255,255,255,0.15);
    width: 80%;
    max-width: 700px;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0px 0px 10px rgba(0,0,0,0.25);

    /* Centrage du bloc */
    margin: 30px auto;
    text-align: center;
}


    .roadmap h2 {
        font-size: 32px;
        margin-bottom: 10px;
        font-weight: 900;
        letter-spacing: 2px;
        text-shadow: 0px 0px 6px rgba(0,0,0,0.3);
    }

    .roadmap ul {
        list-style: none;
        padding: 0;
        font-size: 22px;
        margin: 0;
    }

    .roadmap li {
        margin: 12px 0;
    }

    .htf-text {
        font-weight: 900;
        letter-spacing: 1px;
        text-shadow: 0px 0px 4px rgba(0,0,0,0.3);
    }

    .btn {
        display: inline-block;
        margin-top: 25px;
        padding: 15px 30px;
        background: #ffd34a;
        color: black;
        font-size: 22px;
        font-weight: 900;
        border-radius: 12px;
        text-decoration: none;
        box-shadow: 0px 0px 10px rgba(0,0,0,0.25);
        transition: 0.2s;
    }

    .btn:hover {
        background: #ffea7a;
        transform: scale(1.05);
    }
</style>

</head>

<body>

    <!-- Bannière -->
    <img src="images/Baniere.png" alt="How To Fish Banner" class="banner">

    <!-- Roadmap -->
    <div class="roadmap">
        <h2 class="htf-text">ROADMAP</h2>

        <ul>
            <li><span class="htf-text"><s>Skin unlocked</s></span></li>
            <li><span class="htf-text">Normal fish + drip seen</span></li>
            <li><span class="htf-text">Cosmetic</span></li>
            <li><span class="htf-text">How to: Complete the normal gameplay</span></li>
            <li><span class="htf-text">How to: Complete challenges</span></li>
            <li><span class="htf-text">Easter egg</span></li>
        </ul>
    </div>

    <!-- Lien vers la page des skins -->
    <a href="skin.html" class="btn">Unlocked Skin</a>

</body>
</html>
